<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>온라인 건의함 - 어드민</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      color: #111827;
    }
    .login-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 85vh;
    }
    .login-box {
      background: #ffffff;
      width: 100%;
      max-width: 360px;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .login-box h1 {
      font-size: 20px;
      margin: 0 0 8px 0;
    }
    .login-box p {
      font-size: 13px;
      color: #6b7280;
      margin: 0 0 20px 0;
    }
    .login-box input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .login-box button {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .login-box button:hover {
      background-color: #1d4ed8;
    }

    .dashboard {
      display: none;
      max-width: 900px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 22px;
      margin: 0;
    }
    .header-actions {
      display: flex;
      gap: 8px;
    }
    .btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #374151;
    }
    .btn:hover {
      background: #f9fafb;
    }
    .btn-primary {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: #ffffff;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .stat-card .label {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
    }
    .stat-card .value {
      font-size: 22px;
      font-weight: 700;
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .filters select, .filters input {
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 13px;
      background: #ffffff;
    }
    .filters input {
      flex: 1;
      min-width: 200px;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .item-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      border-left: 4px solid #2563eb;
    }
    .item-card.status-검토중 { border-left-color: #f59e0b; }
    .item-card.status-완료 { border-left-color: #10b981; }

    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 13px;
      color: #6b7280;
    }
    .badge {
      background: #eff6ff;
      color: #1d4ed8;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .author {
      font-weight: 600;
      color: #374151;
    }
    .status-select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .item-content {
      font-size: 14px;
      line-height: 1.6;
      color: #1f2937;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .empty-msg {
      text-align: center;
      padding: 48px 20px;
      background: #ffffff;
      border-radius: 12px;
      color: #6b7280;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <!-- 비밀번호 로그인 화면 -->
  <div id="loginSection" class="login-wrapper">
    <div class="login-box">
      <h1>🔒 어드민 로그인</h1>
      <p>비밀번호를 입력해 주세요.</p>
      <input type="password" id="passwordInput" placeholder="비밀번호 입력" onkeyup="if(event.key==='Enter') login()">
      <button id="loginBtn" onclick="login()">입장하기</button>
    </div>
  </div>

  <!-- 어드민 대시보드 -->
  <div id="dashboardSection" class="dashboard">
    <div class="header">
      <h1>📋 건의함 어드민</h1>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="loadData()">🔄 새로고침</button>
        <button class="btn" onclick="logout()">로그아웃</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="label">전체 건의</div>
        <div class="value" id="statTotal">0</div>
      </div>
      <div class="stat-card">
        <div class="label">접수 대기</div>
        <div class="value" id="statPending" style="color:#2563eb;">0</div>
      </div>
      <div class="stat-card">
        <div class="label">검토중</div>
        <div class="value" id="statReview" style="color:#d97706;">0</div>
      </div>
      <div class="stat-card">
        <div class="label">처리 완료</div>
        <div class="value" id="statDone" style="color:#059669;">0</div>
      </div>
    </div>

    <div class="filters">
      <select id="filterCategory" onchange="renderList()">
        <option value="ALL">전체 분류</option>
        <option value="시설/환경">시설/환경</option>
        <option value="제도/운영">제도/운영</option>
        <option value="칭찬/제안">칭찬/제안</option>
        <option value="기타">기타</option>
      </select>
      <select id="filterStatus" onchange="renderList()">
        <option value="ALL">전체 상태</option>
        <option value="접수">접수</option>
        <option value="검토중">검토중</option>
        <option value="완료">완료</option>
      </select>
      <input type="text" id="searchInput" placeholder="작성자 또는 내용 검색..." oninput="renderList()">
    </div>

    <div id="cardList" class="card-list"></div>
  </div>

  <script>
    let allItems = [];
    let currentPassword = sessionStorage.getItem('admin_pw') || '';

    if (currentPassword) {
      loadData(true);
    }

    function login() {
      const pw = document.getElementById('passwordInput').value;
      if (!pw) {
        alert('비밀번호를 입력해주세요.');
        return;
      }
      currentPassword = pw;
      loadData(false);
    }

    function logout() {
      sessionStorage.removeItem('admin_pw');
      currentPassword = '';
      allItems = [];
      document.getElementById('passwordInput').value = '';
      document.getElementById('dashboardSection').style.display = 'none';
      document.getElementById('loginSection').style.display = 'flex';
    }

    function loadData(isAutoLogin) {
      const loginBtn = document.getElementById('loginBtn');
      loginBtn.disabled = true;
      loginBtn.textContent = '확인 중...';

      google.script.run
        .withSuccessHandler(function(res) {
          loginBtn.disabled = false;
          loginBtn.textContent = '입장하기';

          if (res.success) {
            sessionStorage.setItem('admin_pw', currentPassword);
            allItems = res.data;
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            updateStats();
            renderList();
          } else {
            sessionStorage.removeItem('admin_pw');
            if (!isAutoLogin) {
              alert(res.message);
            }
          }
        })
        .withFailureHandler(function(err) {
          loginBtn.disabled = false;
          loginBtn.textContent = '입장하기';
          alert('오류가 발생했습니다: ' + err.message);
        })
        .getSuggestions(currentPassword);
    }

    function updateStats() {
      document.getElementById('statTotal').textContent = allItems.length;
      document.getElementById('statPending').textContent = allItems.filter(i => i.status === '접수').length;
      document.getElementById('statReview').textContent = allItems.filter(i => i.status === '검토중').length;
      document.getElementById('statDone').textContent = allItems.filter(i => i.status === '완료').length;
    }

    function renderList() {
      const catFilter = document.getElementById('filterCategory').value;
      const statusFilter = document.getElementById('filterStatus').value;
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const container = document.getElementById('cardList');

      const filtered = allItems.filter(item => {
        const matchCat = (catFilter === 'ALL') || (item.category === catFilter);
        const matchStatus = (statusFilter === 'ALL') || (item.status === statusFilter);
        const matchKey = !keyword ||
          item.content.toLowerCase().includes(keyword) ||
          item.author.toLowerCase().includes(keyword);
        return matchCat && matchStatus && matchKey;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-msg">표시할 건의사항이 없습니다.</div>';
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="item-card status-${escapeHtml(item.status)}">
          <div class="item-top">
            <div class="meta">
              <span class="badge">${escapeHtml(item.category)}</span>
              <span class="author">${escapeHtml(item.author)}</span>
              <span>· ${escapeHtml(item.timestamp)}</span>
            </div>
            <select class="status-select" onchange="changeStatus(${item.rowIndex}, this)">
              <option value="접수" ${item.status === '접수' ? 'selected' : ''}>접수</option>
              <option value="검토중" ${item.status === '검토중' ? 'selected' : ''}>검토중</option>
              <option value="완료" ${item.status === '완료' ? 'selected' : ''}>완료</option>
            </select>
          </div>
          <div class="item-content">${escapeHtml(item.content)}</div>
        </div>
      `).join('');
    }

    function changeStatus(rowIndex, selectEl) {
      const newStatus = selectEl.value;
      selectEl.disabled = true;

      google.script.run
        .withSuccessHandler(function(res) {
          selectEl.disabled = false;
          if (res.success) {
            const target = allItems.find(i => i.rowIndex === rowIndex);
            if (target) target.status = newStatus;
            updateStats();
            renderList();
          } else {
            alert('상태 변경 실패: ' + res.message);
          }
        })
        .withFailureHandler(function(err) {
          selectEl.disabled = false;
          alert('오류 발생: ' + err.message);
        })
        .updateStatus(currentPassword, rowIndex, newStatus);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>

</body>
</html>
